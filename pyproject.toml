[project]
name = "niuniu-stock-announcer"
version = "0.1.2"
description = "NiuNiu Stock Announcer, a local stock announcement monitoring workflow."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "a-share-announcement",
    "loguru>=0.7.3",
    "openai>=2.11.0",
    "psycopg[binary]>=3.3.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymupdf4llm>=0.2.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.7",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "typer>=0.25.1",
]

[project.scripts]
niuniu-stock = "cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.uv.sources]
a-share-announcement = { git = "https://github.com/mochenya/A-Share-Announcement.git" }

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
extend-select = ["D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "live: 访问真实公告 Provider 或公开 PDF 的显式网络契约测试",
    "postgres: 使用测试专用本机 PostgreSQL 的集成测试",
]
pythonpath = ["src"]
